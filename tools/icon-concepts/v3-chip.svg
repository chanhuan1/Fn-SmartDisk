<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2e"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7ff0"/>
      <stop offset="1" stop-color="#4f9ff0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bg3)"/>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="none" stroke="#8b7ff0" stroke-opacity=".3" stroke-width="2"/>
  <!-- chip body -->
  <g transform="translate(128,128)">
    <rect x="-46" y="-46" width="92" height="92" rx="16" fill="none" stroke="url(#acc3)" stroke-width="8"/>
    <!-- pins -->
    <g stroke="url(#acc3)" stroke-width="7" stroke-linecap="round">
      <line x1="-26" y1="-46" x2="-26" y2="-66"/><line x1="0" y1="-46" x2="0" y2="-66"/><line x1="26" y1="-46" x2="26" y2="-66"/>
      <line x1="-26" y1="46" x2="-26" y2="66"/><line x1="0" y1="46" x2="0" y2="66"/><line x1="26" y1="46" x2="26" y2="66"/>
      <line x1="-46" y1="-26" x2="-66" y2="-26"/><line x1="-46" y1="0" x2="-66" y2="0"/><line x1="-46" y1="26" x2="-66" y2="26"/>
      <line x1="46" y1="-26" x2="66" y2="-26"/><line x1="46" y1="0" x2="66" y2="0"/><line x1="46" y1="26" x2="66" y2="26"/>
    </g>
    <!-- inner disk -->
    <circle r="24" fill="none" stroke="url(#acc3)" stroke-width="6"/>
    <circle r="7" fill="#8b7ff0"/>
  </g>
  <!-- circuit traces -->
  <g stroke="#43c975" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M128 194 V214 H160"/>
    <path d="M128 62 V42 H96"/>
  </g>
  <circle cx="160" cy="214" r="5" fill="#43c975"/>
  <circle cx="96" cy="42" r="5" fill="#43c975"/>
</svg>
