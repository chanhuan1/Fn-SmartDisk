<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2a33"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd6e8"/>
      <stop offset="1" stop-color="#2ba8bd"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background so any container crop keeps the subject visible -->
  <rect width="256" height="256" rx="56" fill="url(#bg1)"/>
  <!-- disk: centered upper area, large enough to survive scaling -->
  <g transform="translate(128,104)">
    <circle r="54" fill="none" stroke="url(#acc1)" stroke-width="10"/>
    <circle r="31" fill="none" stroke="url(#acc1)" stroke-width="6" opacity=".55"/>
    <circle r="11" fill="#4fd6e8"/>
  </g>
  <!-- pulse / heartbeat: centered lower area with safe margins -->
  <path d="M56 196 H92 L108 172 L124 210 L140 182 L150 196 H200"
        fill="none" stroke="#43c975" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
